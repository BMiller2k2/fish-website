@if (!visible()) {
  <button class="chat-toggle" (click)="openFromPill()">💬 Ask the fish guide</button>
}

@if (visible()) {
  <section
    class="chat-panel"
    [class.collapsed]="collapsed()"
    [class.attention]="attention()"
    (animationend)="clearAttention()"
  >
    <header (click)="onHeaderClick($event)" title="Click to collapse or expand">
      <span>Fish guide</span>
      <span class="chat-header-actions">
        <button class="ghost chat-collapse-btn" type="button" aria-label="Collapse chat">⌄</button>
        <button
          class="ghost chat-close-btn"
          type="button"
          aria-label="Close chat"
          (click)="close()"
        >
          ✕
        </button>
      </span>
    </header>

    <div class="chat-log" #log>
      @for (b of bubbles(); track $index) {
        <div [class]="'msg ' + b.role">{{ b.text }}</div>
      }
    </div>

    <form class="chat-input" (submit)="$event.preventDefault(); send()">
      <input
        #input
        type="text"
        name="q"
        autocomplete="off"
        placeholder="e.g. Which fish can breathe air?"
        [(ngModel)]="text"
        [disabled]="pending()"
      />
      <button type="submit" [disabled]="pending()">Send</button>
    </form>
  </section>
}
